name: Build Poker Trainer APK

on:
  push:
    branches: [poker-trainer-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org app.pokertrainer .

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Give APK unique filename
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/poker-trainer-build-${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poker-trainer-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/poker-trainer-build-${{ github.run_number }}.apk
          retention-days: 14
